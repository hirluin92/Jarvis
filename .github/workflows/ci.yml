name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # placeholders: tests and evals use an isolated SQLite DB and never touch Telegram
      DATABASE_URL: sqlite+aiosqlite:///ci.db
      TELEGRAM_BOT_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Evals (real model, capped spend)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub forbids secret names starting with GITHUB_, so the secret is GH_READ_TOKEN
          GITHUB_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: uv run python -m evals.run --max-cost 1.00
