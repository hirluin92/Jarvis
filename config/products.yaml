# Catalog of the products the morning report monitors.
# To add a product, append an entry: no code changes needed.
products:
  - name: Jarvis
    urls:
      - http://127.0.0.1:8000/health
    github_repo: hirluin92/Jarvis
    # phase 10: Jarvis as the test product of the build worker (docs/CAPOCANTIERE.md)
    local_path: C:/Users/Administrator.ITWEAKS-PC/Desktop/Progetti/Jarvis
    build_enabled: true
    test_command: uv run pytest -q
    protected_paths:
      - ".env*"
      - ".github/**"
      - app/access.py
      - worker/**
      - config/products.yaml
