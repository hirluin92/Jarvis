[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=0.40",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-telegram-bot>=21",
  "httpx>=0.27",
  "pyyaml>=6",
  "tzdata",
  "aiosqlite>=0.20",
  "pipecat-ai[cartesia,deepgram,elevenlabs,silero,webrtc]>=1.16.0",
  "pipecat-ai-prebuilt>=1.4.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "aiosqlite>=0.20"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
